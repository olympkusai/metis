syntax = "proto3";

package helios;

option go_package = "github.com/f-n-2/helios";

import "google/protobuf/timestamp.proto";

// OHLCV represents Open, High, Low, Close, Volume data
message OHLCV {
  string symbol = 1;
  string interval = 2;
  int64 open_time = 3;
  int64 close_time = 4;
  double open = 5;
  double high = 6;
  double low = 7;
  double close = 8;
  double volume = 9;
  double quote_volume = 10;
  int64 trades = 11;
}

// Feature represents a calculated feature
message Feature {
  string name = 1;
  double value = 2;
  google.protobuf.Timestamp timestamp = 3;
}

// Indicator represents a technical indicator
message Indicator {
  string name = 1;
  double value = 2;
  google.protobuf.Timestamp timestamp = 3;
}

// GetOHLCVRequest - unary request for OHLCV data
message GetOHLCVRequest {
  string symbol = 1;
  string interval = 2;
  int64 from = 3;
  int64 to = 4;
  int32 limit = 5;
}

// GetOHLCVResponse - unary response with OHLCV data
message GetOHLCVResponse {
  repeated OHLCV candles = 1;
  int32 count = 2;
}

// StreamOHLCVRequest - server streaming request for OHLCV data
message StreamOHLCVRequest {
  string symbol = 1;
  string interval = 2;
  int64 from = 3;
}

// GetFeaturesRequest - unary request for features
message GetFeaturesRequest {
  string symbol = 1;
  string interval = 2;
  repeated string features = 3;
  int64 from = 4;
  int64 to = 5;
}

// GetFeaturesResponse - unary response with features
message GetFeaturesResponse {
  repeated Feature features = 1;
  int32 count = 2;
}

// StreamFeaturesRequest - server streaming request for features
message StreamFeaturesRequest {
  string symbol = 1;
  string interval = 2;
  repeated string features = 3;
}

// GetIndicatorsRequest - unary request for indicators
message GetIndicatorsRequest {
  string symbol = 1;
  string interval = 2;
  repeated string indicators = 3;
  int64 from = 4;
  int64 to = 5;
}

// GetIndicatorsResponse - unary response with indicators
message GetIndicatorsResponse {
  repeated Indicator indicators = 1;
  int32 count = 2;
}

// StreamIndicatorsRequest - server streaming request for indicators
message StreamIndicatorsRequest {
  string symbol = 1;
  string interval = 2;
  repeated string indicators = 3;
}

// SubscriptionRequest - bidirectional streaming subscription
message SubscriptionRequest {
  repeated string symbols = 1;
  repeated string intervals = 2;
}

// SubscriptionResponse - bidirectional streaming response
message SubscriptionResponse {
  oneof data {
    OHLCV ohlcv = 1;
    Feature feature = 2;
    Indicator indicator = 3;
  }
}

// Calculator Service Messages (RabbitMQ)

// CalculationRequest represents a request for technical analysis calculations
message CalculationRequest {
  string request_id = 1;           // Unique identifier for the request (UUID v4)
  string symbol = 2;               // Trading pair symbol (e.g., "BTCUSDT")
  string interval = 3;             // Candle interval (e.g., "1m", "1h", "1d")
  int64 start_time = 4;            // Start timestamp in Unix seconds
  int64 end_time = 5;              // End timestamp in Unix seconds
  repeated string features = 6;     // List of features to calculate
  repeated string indicators = 7;  // List of indicators to calculate
}

// FeatureResult represents a calculated feature value
message FeatureResult {
  string name = 1;                           // Feature name (e.g., "returns", "ma_21")
  repeated FeatureValue values = 2;          // Array of feature values over time
}

// FeatureValue represents a single feature value at a specific timestamp
message FeatureValue {
  google.protobuf.Timestamp timestamp = 1;  // Timestamp of the value
  double value = 2;                         // Feature value
}

// IndicatorResult represents a calculated indicator value
message IndicatorResult {
  string name = 1;                           // Indicator name (e.g., "rsi_14", "macd")
  repeated IndicatorValue values = 2;       // Array of indicator values over time
}

// IndicatorValue represents a single indicator value at a specific timestamp
message IndicatorValue {
  google.protobuf.Timestamp timestamp = 1;  // Timestamp of the value
  double value = 2;                         // Indicator value
}

// CalculationCompleted represents a successful calculation response
message CalculationCompleted {
  string request_id = 1;                     // Request ID from the original request
  string symbol = 2;                         // Trading pair symbol
  string interval = 3;                       // Candle interval
  int64 start_time = 4;                      // Start timestamp
  int64 end_time = 5;                        // End timestamp
  repeated FeatureResult features = 6;       // Calculated features
  repeated IndicatorResult indicators = 7;   // Calculated indicators
  google.protobuf.Timestamp calculated_at = 8; // When the calculation was completed
}

// CalculationFailed represents a failed calculation response
message CalculationFailed {
  string request_id = 1;                     // Request ID from the original request
  string error = 2;                          // Error message
  string error_code = 3;                     // Error code (e.g., "INSUFFICIENT_DATA")
  google.protobuf.Timestamp timestamp = 4;  // When the error occurred
}

// HeliosService defines the gRPC service
service HeliosService {
  // Unary RPCs
  rpc GetOHLCV(GetOHLCVRequest) returns (GetOHLCVResponse);
  rpc GetFeatures(GetFeaturesRequest) returns (GetFeaturesResponse);
  rpc GetIndicators(GetIndicatorsRequest) returns (GetIndicatorsResponse);

  // Server Streaming RPCs
  rpc StreamOHLCV(StreamOHLCVRequest) returns (stream OHLCV);
  rpc StreamFeatures(StreamFeaturesRequest) returns (stream Feature);
  rpc StreamIndicators(StreamIndicatorsRequest) returns (stream Indicator);

  // Bidirectional Streaming RPCs
  rpc SubscribeToSymbols(stream SubscriptionRequest) returns (stream SubscriptionResponse);
}
