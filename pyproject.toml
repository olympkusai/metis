[tool.poetry]
name = "crypto-agent"
version = "0.1.0"
description = "Agente de Investimento Cripto com Raciocínio"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
langchain = "^0.3.0"
langchain-openai = "^0.3.0"
langgraph = "^0.2.0"
chromadb = "^0.6.0"
mlflow = "^2.22.0"
redis = "^5.3.0"
asyncpg = "^0.30.0"
sqlalchemy = "^2.0.0"
python-dotenv = "^1.0.0"
pydantic-settings = "^2.8.0"
httpx = "^0.28.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
