[tool.poetry]
name = "metis"
version = "0.1.0"
description = "Metis — assistente de finanças pessoais (olympkusai)"
authors = ["olympkusai <dev@olympkusai.com>"]
readme = "README.md"
packages = [{ include = "metis" }]

[tool.poetry.dependencies]
python = "^3.14"
fastapi = "^0.116.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
langchain = "^0.3.0"
langchain-openai = "^0.3.0"
langgraph = "^0.2.0"
asyncpg = "^0.30.0"
pgvector = "^0.3.0"
sqlalchemy = "^2.0.0"
python-dotenv = "^1.0.0"
pydantic-settings = "^2.8.0"
httpx = "^0.27.0"
requests = "^2.33.1"
PyJWT = "^2.10.0"
cryptography = "^43.0.0"
mcp = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.23.0"
black = "^24.0.0"
ruff = "^0.1.0"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
