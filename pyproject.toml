[tool.poetry]
name = "crypto-agent"
version = "0.1.0"
description = "Agente de Investimento Cripto com Raciocínio"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
langchain = "^0.1.0"
langchain-openai = "^0.0.5"
langgraph = "^0.0.26"
chromadb = "^0.4.0"
mlflow = "^2.9.0"
redis = "^5.0.0"
asyncpg = "^0.29.0"
sqlalchemy = "^2.0.0"
python-dotenv = "^1.0.0"
pydantic-settings = "^2.1.0"
httpx = "^0.25.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
